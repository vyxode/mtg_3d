name: Cartas de Magic

# Compiles every card the engine can play from Scryfall's Oracle data (apps/web/public/oracle.json), then fetches their
# Spanish printings (apps/web/public/es.json), and commits both. Runs by hand, every week (new sets), and whenever the
# Oracle compiler, the Spanish fetch or the hand-written cards change.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths: ['packages/cards/src/oracle.ts', 'packages/cards/src/defs.ts', 'apps/server/src/oracle-cards.ts', 'apps/server/src/es-cards.ts']

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: NODE_OPTIONS=--max-old-space-size=4096 pnpm cards:oracle
      - run: pnpm cards:es
      - name: Commit if anything changed
        run: |
          git add apps/web/public/oracle.json apps/web/public/es.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cartas de Magic: actualizar desde Scryfall"
          git pull --rebase
          git push
