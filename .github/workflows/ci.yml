name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest # ships Google Chrome, used through Playwright's 'chrome' channel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/

  p2p:
    runs-on: ubuntu-latest # the GitHub Pages build: two browsers play through WebRTC, no game server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright test -c playwright.p2p.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-p2p-results
          path: test-results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data && chmod 777 data
      - run: docker compose -f infra/docker-compose.yml --env-file .env.example --profile app up -d --build --wait
      - run: curl -fsS http://localhost:3001/api/status
      - run: curl -fsS http://localhost:3001/ | grep -q 'id="root"'
      - run: docker compose -f infra/docker-compose.yml --env-file .env.example logs app | grep -q 'Database connected'
      - if: failure()
        run: docker compose -f infra/docker-compose.yml --env-file .env.example logs
