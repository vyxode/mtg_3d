name: Cartas en español

# Fetches the Spanish printing (name, type, text, image) of every card the engine can play from Scryfall and commits
# packages/cards/src/es.ts. Runs by hand and whenever card definitions change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/cards/src/defs.ts']

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cards:es
      - name: Commit if anything changed
        run: |
          git diff --quiet packages/cards/src/es.ts && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cartas en español: actualizar desde Scryfall" packages/cards/src/es.ts
          git push
